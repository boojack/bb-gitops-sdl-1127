name: Deploy schema

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated database targets
        required: true
      file-pattern:
        description: Glob of the SQL files to deploy
        default: schema/*.sql
      declarative:
        description: Deploy the files as a desired-state schema (SDL)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the bytebase-action build under test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download action-dev --repo "$GITHUB_REPOSITORY" --pattern bytebase-action --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/bytebase-action"

      - name: Deploy to test
        env:
          BYTEBASE_SERVICE_ACCOUNT: ${{ secrets.BYTEBASE_SERVICE_ACCOUNT }}
          BYTEBASE_SERVICE_ACCOUNT_SECRET: ${{ secrets.BYTEBASE_SERVICE_ACCOUNT_SECRET }}
          TARGETS: ${{ inputs.targets }}
          FILE_PATTERN: ${{ inputs.file-pattern }}
          DECLARATIVE: ${{ inputs.declarative }}
        run: |
          "$RUNNER_TEMP/bytebase-action" rollout \
            --url "${{ vars.BYTEBASE_URL }}" \
            --project projects/gitops-sdl \
            --targets "$TARGETS" \
            --file-pattern "$FILE_PATTERN" \
            --declarative="$DECLARATIVE" \
            --target-stage environments/test \
            --output bytebase-rollout.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bytebase-rollout
          path: bytebase-rollout.json
